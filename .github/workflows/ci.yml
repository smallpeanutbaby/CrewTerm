name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build CrewTerm.slnx -c Release

      - name: Test
        run: dotnet test CrewTerm.slnx -c Release --no-build --logger trx --results-directory TestResults

      # 把失败测试的消息与堆栈写成注释，直接显示在运行摘要与提交的检查结果中。
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content -LiteralPath $_.FullName -Raw
            foreach ($result in @($trx.TestRun.Results.UnitTestResult) | Where-Object { $_.outcome -eq 'Failed' }) {
              $text = "$($result.Output.ErrorInfo.Message)`n$($result.Output.ErrorInfo.StackTrace)"
              if ($text.Length -gt 3000) { $text = $text.Substring(0, 3000) }
              $text = $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              $title = $result.testName.Replace('%', '%25').Replace(',', '%2C').Replace(':', '%3A')
              Write-Output "::error title=$title::$text"
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
