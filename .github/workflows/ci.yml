name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build CrewTerm.slnx -c Release

      # 逐个运行测试项目：多个程序集同时启动大量真实进程（伪终端、Shell、PowerShell、daemon）时，
      # 共享的 CI 机器负载过高，计时类测试会无谓地超时。
      - name: Test
        shell: pwsh
        run: |
          $failed = @()
          foreach ($project in Get-ChildItem tests -Filter '*.Tests.csproj' -Recurse | Sort-Object Name) {
            dotnet test $project.FullName -c Release --no-build --logger trx --results-directory TestResults
            if ($LASTEXITCODE -ne 0) { $failed += $project.BaseName }
          }
          if ($failed) { Write-Output "::error title=Failed test projects::$($failed -join ', ')"; exit 1 }

      # 把失败测试写成注释，直接显示在运行摘要与提交的检查结果中。每个步骤最多显示 10 条错误注释，
      # 因此先输出一条列出全部失败测试名称的汇总，再输出各测试的消息与堆栈。
      - name: Annotate failed tests
        if: failure()
        shell: pwsh
        run: |
          function Escape([string]$text) { $text.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A') }
          $failures = @(Get-ChildItem TestResults -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content -LiteralPath $_.FullName -Raw
            @($trx.TestRun.Results.UnitTestResult) | Where-Object { $_.outcome -eq 'Failed' }
          })
          if ($failures.Count -eq 0) { exit 0 }
          $names = ($failures | ForEach-Object { $_.testName }) -join "`n"
          Write-Output "::error title=$($failures.Count) failed tests::$(Escape $names)"
          foreach ($result in $failures) {
            $text = "$($result.Output.ErrorInfo.Message)`n$($result.Output.ErrorInfo.StackTrace)"
            if ($text.Length -gt 3000) { $text = $text.Substring(0, 3000) }
            $title = $result.testName.Replace('%', '%25').Replace(',', '%2C').Replace(':', '%3A')
            Write-Output "::error title=$title::$(Escape $text)"
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: ignore
