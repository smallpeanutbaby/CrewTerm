name: 功能建议
description: 提出新功能或改进现有功能
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢提出建议。请先确认 [README 的已知限制](https://github.com/smallpeanutbaby/CrewTerm/blob/main/README.md#已知限制) 与已有的 Issue 中没有相同的内容。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你在什么场景下遇到了什么困难？
      placeholder: 同时运行四个 Agent 时，我需要……，但现在只能……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的做法
      description: 你希望界面、CLI 或插件接口如何工作
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 现有功能、脚本或插件能否部分解决？
  - type: dropdown
    id: area
    attributes:
      label: 涉及的部分
      multiple: true
      options:
        - 终端与布局
        - Agent 状态与协作
        - 原生会话恢复
        - 编辑器与文件
        - Git 与 worktree
        - 后台任务与流水线
        - 本地插件
        - 命令行接口
        - 跨平台
        - 文档
  - type: checkboxes
    id: contribute
    attributes:
      label: 参与
      options:
        - label: 我愿意提交拉取请求实现这个功能
