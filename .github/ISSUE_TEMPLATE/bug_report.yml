name: 问题报告
description: CrewTerm 的行为与文档不符、崩溃或出错
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告问题。提交前请先搜索是否已有相同的 Issue，并看一下 [常见问题](https://github.com/smallpeanutbaby/CrewTerm/blob/main/docs/faq.md)。
        **安全问题请不要在这里提交**，按 [安全策略](https://github.com/smallpeanutbaby/CrewTerm/blob/main/SECURITY.md) 私下报告。
  - type: input
    id: version
    attributes:
      label: CrewTerm 版本
      description: "`crewterm --version` 的输出；从源码运行请附上提交哈希"
      placeholder: CrewTerm 0.3.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: 系统版本与架构
      placeholder: Windows 11 24H2 x64 / Ubuntu 24.04 arm64 / macOS 15 Apple Silicon
    validations:
      required: true
  - type: input
    id: terminal
    attributes:
      label: 终端程序与窗口大小
      placeholder: Windows Terminal 1.22，150 × 45
  - type: input
    id: agent
    attributes:
      label: 相关的 Agent CLI 与版本（如有）
      placeholder: Claude Code 2.1.x / Codex 0.163
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 尽量从一个新的 `--state-dir` 开始，写出每一步按键或命令
      placeholder: |
        1. crewterm --state-dir /tmp/ct --project .
        2. 按 F3，选择 ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可以附上截图或 `crewterm read <ID>` 的输出
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 后台服务的问题请附上状态目录中 `server-error.log` 的相关内容。**提交前删除其中的路径、命令或其他敏感信息。**
      render: text
